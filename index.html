<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Page</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1e; --muted:#6b6b70; --accent:#ff6600; --line:#e4e4e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1c1c1f; --text:#ececee; --muted:#9a9aa0; --line:#2c2c30; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:var(--card); color:var(--text);
                 padding:6px 14px; border-radius:999px; cursor:pointer; font:inherit; }
  .tabs button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; margin-bottom:10px; }
  .item a { color:var(--text); text-decoration:none; font-weight:600; }
  .item a:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:.82rem; margin-top:4px; }
  .msg { color:var(--muted); text-align:center; padding:32px 0; }
  .more { display:block; margin:16px auto 0; padding:8px 20px; border-radius:8px;
          border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📰 News Page</h1>
  <div class="sub">Hacker News 공개 API에서 실시간으로 불러옵니다 (API 키 불필요)</div>
  <div class="tabs" id="tabs">
    <button data-feed="topstories" aria-pressed="true">인기</button>
    <button data-feed="newstories" aria-pressed="false">최신</button>
    <button data-feed="beststories" aria-pressed="false">베스트</button>
  </div>
  <div id="list"><div class="msg">불러오는 중…</div></div>
  <button class="more" id="more" hidden>더 보기</button>
</div>

<script>
const API = "https://hacker-news.firebaseio.com/v0";
const PAGE_SIZE = 20;
let ids = [], shown = 0, feed = "topstories";
const $list = document.getElementById("list");
const $more = document.getElementById("more");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function ago(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 60) return `${Math.max(m, 1)}분 전`;
  if (m < 1440) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
}

function safeUrl(u, id) {
  try { const x = new URL(u); if (x.protocol === "http:" || x.protocol === "https:") return x.href; } catch {}
  return `https://news.ycombinator.com/item?id=${id}`;
}

async function loadFeed(name) {
  feed = name; shown = 0; $more.hidden = true;
  $list.innerHTML = '<div class="msg">불러오는 중…</div>';
  try {
    const r = await fetch(`${API}/${name}.json`);
    if (!r.ok) throw new Error(r.status);
    ids = await r.json();
    $list.innerHTML = "";
    await loadMore();
  } catch (e) {
    $list.innerHTML = `<div class="msg">뉴스를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>`;
  }
}

async function loadMore() {
  $more.disabled = true;
  const batch = ids.slice(shown, shown + PAGE_SIZE);
  const items = await Promise.all(batch.map(id =>
    fetch(`${API}/item/${id}.json`).then(r => r.json()).catch(() => null)));
  for (const it of items) {
    if (!it || !it.title) continue;
    const el = document.createElement("div");
    el.className = "item";
    const url = safeUrl(it.url, it.id);
    let host = "";
    try { host = new URL(url).hostname.replace(/^www\./, ""); } catch {}
    el.innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
      <div class="meta">${esc(host)} · ▲ ${it.score ?? 0} · ${esc(it.by)} · ${ago(it.time)} ·
      <a href="https://news.ycombinator.com/item?id=${it.id}" target="_blank" rel="noopener noreferrer"
         style="font-weight:400;color:inherit">댓글 ${it.descendants ?? 0}</a></div>`;
    $list.appendChild(el);
  }
  shown += PAGE_SIZE;
  $more.hidden = shown >= ids.length;
  $more.disabled = false;
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  loadFeed(b.dataset.feed);
});
$more.addEventListener("click", loadMore);
loadFeed(feed);
</script>
</body>
</html>
